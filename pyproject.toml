[project]
name = "verdict"
version = "0.1.0"
description = "Calibrated LLM-as-judge evaluation service with bias controls, human-agreement metrics, CI merge gating and a leaderboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2.0"]
dev = ["pytest>=8.0", "locust>=2.24"]

[project.scripts]
verdict = "verdict.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
